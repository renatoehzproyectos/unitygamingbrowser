name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # necesario para publicar el APK en Releases

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Instala Gradle 8.9 (el repo no incluye gradlew); el Android SDK ya viene en ubuntu-latest
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Compilar APK (debug, firmado con la clave debug, instalable)
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Fingerprint de firma (debe coincidir con assetlinks.json)
        run: keytool -list -v -keystore debug.keystore -storepass android | grep SHA256 | tee -a $GITHUB_STEP_SUMMARY

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk UnityGamingBrowser-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: UnityGamingBrowser-apk
          path: UnityGamingBrowser-debug.apk

      # Descarga directa desde el móvil: pestaña Releases del repo
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          prerelease: true
          files: UnityGamingBrowser-debug.apk
